name: Android verification
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - run: ./gradlew :pyeditor:testDevelopmentDebugUnitTest :pyeditor:lintDevelopmentDebug

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v3
      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > release-keystore.jks
          {
            echo "storeFile=$GITHUB_WORKSPACE/release-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
      - run: chmod +x gradlew
      - run: ./gradlew :pyeditor:assembleProductionRelease
      - name: Read release version
        id: version
        shell: bash
        run: echo "name=$(grep -o 'versionName = "[^"]*"' pyeditor/build.gradle.kts | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: pixelpy-${{ steps.version.outputs.name }}-release
          path: pyeditor/build/outputs/apk/production/release/*.apk
      - name: Remove signing material
        if: always()
        run: rm -f release-keystore.jks keystore.properties
